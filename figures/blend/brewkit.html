<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Brewery-kit CBD extraction (10 bbl jacketed)</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1240px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* The spec-driven figure: the filters, the SOP panel and the register. */

.sk-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 10px 0 4px;
}
.sk-filters[hidden] { display: none; }
.sk-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--anatomy-faint);
  border-radius: 999px;
  background: transparent;
  color: var(--anatomy-muted);
  font: 10px/1 var(--anatomy-mono);
  letter-spacing: 0.04em;
  padding: 6px 10px;
  cursor: pointer;
}
.sk-chip[aria-pressed="true"] {
  border-color: var(--anatomy-hi);
  color: var(--anatomy-strong);
}
.sk-chip i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1px solid var(--anatomy-mid);
  display: inline-block;
}

/* A filter dims what is not in it, rather than hiding it: the plant is
   still there, the reader is just looking at one part of it. */
[data-filtering] .it[data-active="false"] {
  opacity: 0.1;
}
[data-filtering] .it[data-active="true"] .iso-fill {
  stroke: var(--anatomy-hi);
  stroke-width: 0.9px;
}

.sk-flow {
  fill: none;
  stroke: var(--sk-flow-line, #74a4ff);
  stroke-width: 1.1;
  stroke-dasharray: 4 6;
  opacity: 0.4;
  animation: sk-flow 1.4s linear infinite;
}
@keyframes sk-flow {
  to { stroke-dashoffset: -18; }
}
@media (prefers-reduced-motion: reduce) {
  .sk-flow { animation: none; }
}
.iso[data-theme="light"] .sk-flow { --sk-flow-line: #2f5fd0; }

.sk-stage { position: relative; }

/* The nameplates, in screen space over the drawing. */
.sk-labels {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.sk-label {
  position: absolute;
  transform: translate(-50%, -50%);
  white-space: pre-line;
  text-align: center;
  font: 500 10px/1.25 var(--anatomy-mono);
  letter-spacing: 0.02em;
  color: var(--anatomy-text);
  text-shadow: 0 0 3px var(--anatomy-paper), 0 0 6px var(--anatomy-paper);
}
.sk-label-name {
  font-weight: 600;
  color: var(--anatomy-strong);
}
.sk-label-stream {
  font-size: 9px;
  color: var(--anatomy-muted);
  opacity: 0.85;
}
[data-filtering] .sk-label[data-active="false"] {
  opacity: 0.18;
}

/* The review panel: the checks, and the state of the evidence per part. */
.sk-review {
  margin: 18px 0 4px;
  border: 1px solid var(--anatomy-mid);
  border-radius: 10px;
  background: var(--anatomy-card);
  padding: 16px 18px;
}
.sk-review[hidden] { display: none; }
.sk-review-head h3 {
  margin: 0;
  font: 600 13px/1 var(--anatomy-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--anatomy-strong);
}
.sk-review-head p {
  margin: 6px 0 0;
  font: 11px/1 var(--anatomy-mono);
  color: var(--anatomy-muted);
}
.sk-review-cols {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 26px;
  margin-top: 14px;
}
.sk-review h4 {
  margin: 0 0 8px;
  font: 600 10px/1 var(--anatomy-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}
.sk-review-checks {
  margin: 0;
  padding: 0;
  list-style: none;
}
.sk-review-checks li {
  display: grid;
  gap: 2px;
  padding: 6px 0 6px 18px;
  border-bottom: 1px solid var(--anatomy-faint);
  position: relative;
  font-size: 12px;
}
.sk-review-checks li::before {
  content: "✓";
  position: absolute;
  left: 0;
  color: var(--anatomy-green, #30a46c);
}
.sk-review-checks li.fail::before {
  content: "✕";
  color: var(--anatomy-red, #e5484d);
}
.sk-review-checks b { color: var(--anatomy-strong); font-weight: 600; }
.sk-review-checks span { color: var(--anatomy-muted); font-size: 11px; }
.sk-review-table {
  width: 100%;
  border-collapse: collapse;
  font: 11px/1.5 var(--anatomy-mono);
}
.sk-review-table th,
.sk-review-table td {
  border-bottom: 1px solid var(--anatomy-faint);
  padding: 4px 6px;
  text-align: left;
  vertical-align: top;
}
.sk-review-table th { color: var(--anatomy-strong); font-weight: 600; }
.sk-review-table td i {
  display: block;
  font-style: normal;
  font-size: 9px;
  color: var(--anatomy-muted);
}
.sk-review-table tr.state-good td:nth-child(2) { color: #30a46c; }
.sk-review-table tr.state-thin td:nth-child(2) { color: #d4a72c; }
.sk-review-table tr.state-none td:nth-child(2) { color: #e5484d; }

/* The inspector: what a part is, what it does, and its place in the process. */
.sk-inspector {
  margin: 18px 0 4px;
  border: 1px solid var(--anatomy-mid);
  border-radius: 10px;
  background: var(--anatomy-card);
  overflow: hidden;
}
.sk-inspector[hidden] { display: none; }
.sk-inspector header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--anatomy-faint);
  background: var(--anatomy-page);
}
.sk-inspector h3 {
  margin: 0;
  font: 600 14px/1.3 var(--anatomy-mono);
  letter-spacing: 0.04em;
  color: var(--anatomy-strong);
}
.sk-insp-kind {
  margin: 3px 0 0;
  font: 10px/1 var(--anatomy-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}
.sk-inspector header button {
  margin-left: auto;
  border: 1px solid var(--anatomy-faint);
  border-radius: 5px;
  background: transparent;
  color: var(--anatomy-text);
  font: 11px/1 var(--anatomy-mono);
  padding: 6px 9px;
  cursor: pointer;
}
.sk-insp-body {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
  padding: 16px;
}
.sk-insp-body h4 {
  margin: 0 0 8px;
  font: 600 10px/1 var(--anatomy-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}
.sk-insp-body h5 {
  margin: 10px 0 4px;
  font: 600 9px/1 var(--anatomy-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}
.sk-insp-body p {
  margin: 0 0 8px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--anatomy-text);
}
.sk-insp-rows {
  display: grid;
  gap: 4px;
  margin-top: 8px;
}
.sk-insp-row {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 10px;
  align-items: baseline;
  font: 11px/1.5 var(--anatomy-mono);
  border-bottom: 1px solid var(--anatomy-faint);
  padding: 3px 0;
}
.sk-insp-row span { color: var(--anatomy-muted); }
.sk-insp-row b { color: var(--anatomy-strong); font-weight: 600; }
.sk-insp-row i {
  grid-column: 2;
  font-style: normal;
  font-size: 9px;
  color: var(--anatomy-muted);
  opacity: 0.7;
}
.sk-insp-note {
  border-left: 2px solid var(--anatomy-faint);
  padding-left: 10px;
  color: var(--anatomy-muted) !important;
  font-size: 12px !important;
}
.sk-insp-notes {
  margin: 8px 0 0;
  padding-left: 18px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--anatomy-text);
}
.sk-insp-none {
  color: var(--anatomy-muted) !important;
  font-style: italic;
}
.sk-insp-evidence {
  border-top: 1px solid var(--anatomy-faint);
  margin-top: 10px;
  padding-top: 10px;
}
.sk-insp-evidence h4 {
  text-transform: none;
  letter-spacing: 0.01em;
  font-size: 12px;
  color: var(--anatomy-strong);
}
.sk-insp-query {
  font: 10px/1.4 var(--anatomy-mono) !important;
  color: var(--anatomy-muted) !important;
}
.sk-insp-evidence ul {
  margin: 0;
  padding-left: 16px;
  font-size: 11px;
  line-height: 1.6;
}
.sk-insp-evidence a { color: var(--anatomy-text); }
.sk-insp-year {
  font: 9px/1 var(--anatomy-mono);
  color: var(--anatomy-muted);
}

/* The SOP panel. */
.sk-sop {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 28px;
  margin-top: 22px;
  padding: 20px 22px;
  border: 1px solid var(--anatomy-faint);
  border-radius: 10px;
  background: var(--anatomy-card);
}
.sk-sop[hidden] { display: none; }
.sk-sop h3 {
  margin: 0 0 8px;
  font: 600 11px/1 var(--anatomy-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--anatomy-strong);
}
.sk-sop h3:not(:first-child) { margin-top: 20px; }
.sk-sop-title {
  margin: 0 0 12px;
  font-size: 13px;
  color: var(--anatomy-text);
}
.sk-sop-steps {
  margin: 0;
  padding-left: 18px;
  font-size: 13px;
  line-height: 1.6;
}
.sk-sop-steps li { margin-bottom: 9px; }
.sk-sop-steps em,
.sk-assumptions em {
  display: block;
  margin-top: 3px;
  font-style: normal;
  font: 11px/1.5 var(--anatomy-mono);
  color: var(--anatomy-muted);
}
.sk-sop-id {
  font: 10px/1 var(--anatomy-mono);
  letter-spacing: 0.06em;
  color: var(--anatomy-muted);
  border: 1px solid var(--anatomy-faint);
  border-radius: 3px;
  padding: 2px 4px;
  margin-right: 4px;
}
.sk-register {
  width: 100%;
  border-collapse: collapse;
  font: 11px/1.5 var(--anatomy-mono);
}
.sk-register th,
.sk-register td {
  border-bottom: 1px solid var(--anatomy-faint);
  padding: 4px 6px;
  text-align: left;
  vertical-align: top;
}
.sk-register th {
  color: var(--anatomy-strong);
  font-weight: 600;
}
.sk-assumptions {
  margin: 0;
  padding-left: 18px;
  font-size: 12px;
  line-height: 1.6;
}
.sk-assumptions li { margin-bottom: 7px; }

/* The rubric judge: the judgement on top of the checks. */
.sk-review-head .sk-btn { margin-top: 10px; }
.sk-review-rubric { margin-top: 10px; }
.sk-review-rubric p { font: 11px/1.5 var(--anatomy-mono); color: var(--anatomy-text); margin: 0 0 6px; }
.sk-review-rubric ul { margin: 0; padding: 0; list-style: none; }
.sk-review-rubric li {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 10px;
  padding: 5px 0;
  border-bottom: 1px solid var(--anatomy-faint);
  font: 11px/1.5 var(--anatomy-mono);
}
.sk-review-rubric li b { color: var(--anatomy-strong); font-weight: 600; }
.sk-review-rubric li span { color: var(--anatomy-muted); }
.sk-review-rubric li i { grid-column: 1 / -1; font-style: normal; color: var(--anatomy-muted); }

/* The legitimacy register, the diagrams, and the photograph. */
.sk-legitimacy, .sk-diagrams {
  margin: 18px 0 4px;
  border: 1px solid var(--anatomy-mid);
  border-radius: 10px;
  background: var(--anatomy-card);
  padding: 16px 18px;
}
.sk-legitimacy[hidden], .sk-diagrams[hidden] { display: none; }
.sk-legitimacy-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 26px; margin-top: 14px; }
.sk-legitimacy h4, .sk-diagram h4 {
  margin: 0 0 8px;
  font: 600 10px/1 var(--anatomy-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}
.sk-legitimacy-rules, .sk-legitimacy-open { margin: 0; padding: 0; list-style: none; }
.sk-legitimacy-rules li, .sk-legitimacy-open li {
  display: grid; gap: 2px;
  padding: 7px 0;
  border-bottom: 1px solid var(--anatomy-faint);
  font-size: 12px;
}
.sk-legitimacy-rules b, .sk-legitimacy-open b { color: var(--anatomy-strong); font: 600 11px/1.4 var(--anatomy-mono); }
.sk-legitimacy-rules span, .sk-legitimacy-open span { color: var(--anatomy-muted); font: 10px/1.4 var(--anatomy-mono); }
.sk-legitimacy-rules i, .sk-legitimacy-open i { font-style: normal; color: var(--anatomy-text); font-size: 12px; }
.sk-diagram-list { margin-top: 14px; display: grid; gap: 16px; }
.sk-diagram pre {
  margin: 0 0 6px;
  padding: 10px;
  background: var(--anatomy-page);
  border: 1px solid var(--anatomy-faint);
  border-radius: 6px;
  font: 11px/1.5 var(--anatomy-mono);
  overflow-x: auto;
  white-space: pre;
}
.sk-diagram button {
  border: 1px solid var(--anatomy-faint);
  border-radius: 4px;
  background: transparent;
  color: var(--anatomy-muted);
  font: 10px/1 var(--anatomy-mono);
  padding: 5px 9px;
  cursor: pointer;
}
.sk-insp-image { padding: 0 16px 12px; }
.sk-insp-image img { max-width: 100%; max-height: 260px; border-radius: 6px; border: 1px solid var(--anatomy-faint); }
.sk-insp-foot {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  border-top: 1px solid var(--anatomy-faint);
  background: var(--anatomy-page);
}
.sk-insp-foot button {
  border: 1px solid var(--anatomy-mid);
  border-radius: 5px;
  background: transparent;
  color: var(--anatomy-text);
  font: 10px/1 var(--anatomy-mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 7px 10px;
  cursor: pointer;
}
.sk-insp-foot span { font: 10px/1.4 var(--anatomy-mono); color: var(--anatomy-muted); }

/* The safety questions: numbered, attributed, and visibly open. */
.sk-safety {
  margin: 18px 0 4px;
  border: 1px solid var(--anatomy-mid);
  border-radius: 10px;
  background: var(--anatomy-card);
  padding: 16px 18px;
}
.sk-safety[hidden] { display: none; }
.sk-safety-list { margin: 14px 0 0; padding-left: 20px; }
.sk-safety-list li { display: grid; gap: 3px; padding: 9px 0; border-bottom: 1px solid var(--anatomy-faint); font-size: 12px; }
.sk-safety-list li b { color: var(--anatomy-strong); font: 600 11px/1.4 var(--anatomy-mono); letter-spacing: 0.02em; }
.sk-safety-list li span { color: var(--anatomy-muted); font: 10px/1.4 var(--anatomy-mono); }
.sk-safety-list li i { font-style: normal; color: var(--anatomy-text); }
.sk-safety-list li em { font-style: normal; color: var(--anatomy-muted); font: 10px/1.4 var(--anatomy-mono); }
.sk-safety-list li.closed b { text-decoration: line-through; }

      <h3>Standard operating procedure</h3>
      <p class="sk-sop-title">undefined</p>
      <ol class="sk-sop-steps">
        <li><span class="sk-sop-id">OP-05</span> Charge the carrier from the 20 bbl brite tank to the extraction vessel at 2 degC under nitrogen.<em>Accept: 960 L charged; oxygen below 2 % before agitation starts.</em></li><li><span class="sk-sop-id">OP-10</span> Circulate the miscella through the false bottom at 4 turnovers per hour for 2 h at the temperature the operating point sets.<em>Accept: circulation rate 4,800 L/h; temperature within 1 K of the set point for the full hold.</em></li><li><span class="sk-sop-id">OP-15</span> Pass the miscella through the membrane skid in the configured position; record differential pressure per stage.<em>Accept: differential pressure under 1.4 bar per housing; flux recorded at start and end.</em></li><li><span class="sk-sop-id">OP-20</span> Pass the miscella through the media column at the dose the operating point sets; never exceed 2x the standard dose without a re-verification.<em>Accept: colour removal within 5 % of the predicted value; cannabinoid loss inside the published band.</em></li><li><span class="sk-sop-id">OP-25</span> Polish through the 0.2 um and 0.01 um stages to the crystalliser.<em>Accept: filter effluent visibly clear; flux above the minimum on the datasheet.</em></li><li><span class="sk-sop-id">OP-30</span> Crystallise at -40 degC for 8 h with the scraper running.<em>Accept: jacket at -45 degC; crystalliser contents at -40 degC for the full hold.</em></li><li><span class="sk-sop-id">OP-40</span> Draw the mother liquor to the jacketed brite tank at -20 degC.<em>Accept: crystal slurry to isolation; mother liquor transfer complete.</em></li><li><span class="sk-sop-id">OP-50</span> Evaporate the carrier from the mother liquor at the vacuum the operating point sets.<em>Accept: boiling temperature within 2 K of the Antoine prediction at the set vacuum.</em></li><li><span class="sk-sop-id">OP-55</span> Condense the carrier vapour in the four-shell bank at -20 degC.<em>Accept: condensate flow steady; vent scrubber receiving.</em></li><li><span class="sk-sop-id">OP-60</span> Dry the recovered carrier through the 3A/13X sieve stack and return it to the day tank.<em>Accept: water under 200 ppm at the return.</em></li><li><span class="sk-sop-id">OP-70</span> Run the RO on water service only until S-13 is answered in writing by the membrane maker.<em>Accept: permeate conductivity within the element datasheet; no solvent in the feed.</em></li>
      </ol>

    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 1e-9) upper.pop();

}

const hullOf = (points) => hullTagged(points.map((p) => ({ p }))).map(({ p }) => p);

function runsOf(flags) {
  const count = flags.length;
  const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
  if (start < 0) return flags[0] ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
  const runs = [];
  let run = null;
  for (let step = 0; step < count; step++) {
    const index = (start + step) % count;
    if (flags[index]) {
      if (!run) run = [index];
      run.push((index + 1) % count);
    } else if (run) {
      runs.push(run);
      run = null;
    }

  if (run) runs.push(run);
  return runs;
}

function groupsOf(keys) {
  const count = keys.length;

  const start = keys.findIndex((key, index) => key !== keys[(index + count - 1) % count]);
  if (start < 0) {
    if (keys[0] !== null) out.push({ key: keys[0], run: Array.from({ length: count + 1 }, (_, index) => index % count) });
    return out;
  }
  let current = null;
  for (let step = 0; step < count; step++) {
    const index = (start + step) % count;
    const key = keys[index];
    if (current && current.key === key) {
      current.run.push((index + 1) % count);
      continue;
    }
    if (current && current.key !== null) out.push(current);
    current = { key, run: [index, (index + 1) % count] };
  }
  if (current && current.key !== null) out.push(current);
  return out;
}

const stepsFor = (radius, least = 16, most = 112, scale = 0) => Math.max(least, Math.min(most, scale ? Math.ceil((TAU * radius * scale) / 3) : Math.round((radius * 1.3) / 4) * 4));

function chains(edges) {
  const out = [];
  let current = null;
  for (const [a, b, keep] of edges) {
    if (!keep) {
      if (current) out.push(current);
      current = null;
      continue;
    }
    if (!current) current = [a];
    current.push(b);
  }
  if (current) out.push(current);
  if (out.length > 1 && edges[0][2] && edges[edges.length - 1][2]) {
    const last = out.pop();
    out[0] = [...last, ...out[0].slice(1)];

function labelledArcs(nr, na, view, light, gr = nr, ga = na) {

      cuts.push(view.phi - d, view.phi + d);

    for (const threshold of BANDS) {
      const c = (threshold - na * light.a) / (nr * light.flat);

        cuts.push(light.phi - d, light.phi + d);

  const sorted = [...new Set(cuts.map((angle) => Math.round(wrap(angle) * 1e9) / 1e9))].sort((a, b) => a - b);

    const facing = gr * view.flat * Math.cos(angle - view.phi) + ga * view.a;

  if (!sorted.length) {
    const tone = label(0);

  }
  const arcs = sorted.map((from, index) => {
    const to = index + 1 < sorted.length ? sorted[index + 1] : sorted[0] + TAU;
    return { tone: label((from + to) / 2), from, to };
  });
  const merged = [];
  for (const arc of arcs) {
    const last = merged[merged.length - 1];
    if (last && last.tone === arc.tone && Math.abs(last.to - arc.from) < 1e-9) last.to = arc.to;

    merged[0].from = last.from - TAU;
  }
  return merged.filter((arc) => arc.tone >= 0);
}

function hermiteSlopes(run) {
  const n = run.length - 1;
  const h = Array.from({ length: n }, (_, j) => run[j + 1][0] - run[j][0]);
  const delta = h.map((value, j) => (run[j + 1][1] - run[j][1]) / value);
  const d = new Array(n + 1).fill(0);
  const end = (h0, h1, d0, d1) => {
    let value = ((2 * h0 + h1) * d0 - h0 * d1) / (h0 + h1);
    if (Math.sign(value) !== Math.sign(d0)) value = 0;
    else if (Math.sign(d0) !== Math.sign(d1) && Math.abs(value) > Math.abs(3 * d0)) value = 3 * d0;
    return value;
  };
  if (n === 1) d[0] = d[1] = delta[0];
  else {
    d[0] = end(h[0], h[1], delta[0], delta[1]);
    d[n] = end(h[n - 1], h[n - 2], delta[n - 1], delta[n - 2]);
  }
  for (let k = 1; k < n; k++) {
    if (delta[k - 1] * delta[k] <= 0) continue;
    const w1 = 2 * h[k] + h[k - 1];
    const w2 = h[k] + 2 * h[k - 1];
    d[k] = (w1 + w2) / (w1 / delta[k - 1] + w2 / delta[k]);
  }
  return d;
}

function curveRuns(meridian) {
  const m = meridian.length;
  const segments = new Array(m - 1).fill(null);
  let start = 0;
  while (start < m - 1) {
    let end = start + 1;
    while (end < m - 1 && meridian[end][2] && Math.abs(meridian[end + 1][0] - meridian[end][0]) > 1e-9 && Math.abs(meridian[end][0] - meridian[end - 1][0]) > 1e-9) end++;
    const run = meridian.slice(start, end + 1);
    const n = run.length - 1;
    if (n >= 2 && run.every((point, j) => j === 0 || Math.abs(point[0] - run[j - 1][0]) > 1e-9)) {
      const d = hermiteSlopes(run);
      for (let j = 0; j < n; j++) {
        const [s0, r0] = run[j];
        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];
        const radius = (s) => {
          const t = (s - s0) / hj;
          return (2 * t ** 3 - 3 * t ** 2 + 1) * r0 + (t ** 3 - 2 * t ** 2 + t) * hj * d0 + (-2 * t ** 3 + 3 * t ** 2) * r1 + (t ** 3 - t ** 2) * hj * d1;
        };
        const slope = (s) => {
          const t = (s - s0) / hj;
          return ((6 * t ** 2 - 6 * t) * r0 + (6 * t - 6 * t ** 2) * r1) / hj + (3 * t ** 2 - 4 * t + 1) * d0 + (3 * t ** 2 - 2 * t) * d1;

        segments[start + j] = { radius, slope };

    start = end;
  }
  return segments;
}

function curved(meridian, P, segments, { error = 0.2, depth = 6 } = {}) {
  const k = scaleOf(P);

  for (let i = 0; i < meridian.length - 1; i++) {
    const curve = segments[i];
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    if (curve) {
      const split = (a, b, level) => {
        const mid = (a + b) / 2;
        const chord = (curve.radius(a) + curve.radius(b)) / 2;
        if (level < depth && Math.abs(curve.radius(mid) - chord) * k > error) {
          split(a, mid, level + 1);
          out.push([mid, curve.radius(mid), 1]);
          split(mid, b, level + 1);
        }
      };
      split(s0, s1, 0);
    }
    out.push(meridian[i + 1]);
  }
  return out;
}

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {
  const V = viewOf(P);

  const m = meridian.length;
  const faces = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];

    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];

    const [s0] = meridian[i];

    const b = vertexNormal(i + 1, faces[i]);

          const p1 = pointAt(i, b.u, hi[key]);

      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));

    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];

      let score = -Infinity;

        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);

      if (best && score > -0.05) {

        quad(arc, { from: centre, to: centre });
      }

    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;

  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;

      for (let at = 1; at <= run.length; at++) {

    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];

      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;

      refine(mid, b, depth + 1);

    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);

  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;

  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {

        toneRow.push(0);
        continue;
      }

      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;

    tones.push(toneRow);

  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();

      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];
  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);
      }
    for (const [lo, hi, limb0, limb1] of pieces) {
      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);

const stage = document.querySelector(".sk-stage");
const svg = stage.querySelector("svg");
const liveEl = document.querySelector("[data-sk-live]");
const filterBox = document.querySelector("[data-filters]");
const sopBox = document.querySelector("[data-sop]");

const state = { azimuth: 38, elevation: 27, filter: null, value: null };

const FUNCTIONS = ["heat-exchange", "storage", "reaction", "separation", "transport", "filtration"];
const FUNCTION_LABEL = {
  "heat-exchange": "heat exchange",
  storage: "storage",
  reaction: "reaction",
  separation: "separation",
  transport: "pipe runs",
  filtration: "filtration",
};

function draw() {
  const P = KIT.fitProjection(SCENE.bounds, 1240, 900, { pad: 40, azimuth: state.azimuth, elevation: state.elevation });
  const body = SCENE.items.map((item) => {
      let svg = "";
      switch (item.kind) {
        case "deck":
          svg = KIT.solidSvg(KIT.slabOf(item.plan, item.z || 0, item.h || 6, P, item.steps || 8, item.bevel || 0), { tone: item.tone || "hi", flat: item.flat === true });
          break;
        case "vessel": {
          const [cx, cy, z] = item.at;
          const paths = KIT.cylinder(cx, cy, item.r, z, item.h, P, 36, 0);
          const parts = [KIT.solidSvg(paths, { tone: item.tone || "hi", crease: "faint" })];
          if (item.jacket) parts.push(KIT.solidSvg(KIT.cylinder(cx, cy, item.jacket.r, z, item.jacket.h, P, 36), { tone: "lo", flat: true }));
          if (item.media) {
            const media = KIT.cylinder(cx, cy, item.r * 0.94, z + 1, Math.max(2, item.h * (item.media.fill ?? 0.8)), P, 36);
            parts.push(`<path class="sk-media" data-media="${item.media.kind}" d="${media.fill}"/>`);
          }
          if (item.rim) parts.push(KIT.lineSvg(KIT.onTop(KIT.circleRing(cx, cy, item.r + 1.2, 36), z + item.h, P, true), { tone: "mid" }));
          svg = parts.join("");
          break;
        }
        case "pipe": {
          const piece = KIT.tubePieces(item.points, item.r || 3.2, P, { maxLength: 40, spacing: 2.2, caps: true });
          const parts = [KIT.tubeSvg(piece, { tone: item.tone || "hi" })];
          if (item.flow) parts.push(`<path class="sk-flow" data-stream="${item.id}" d="${KIT.pathOf(item.points.map((p) => KIT.iso(p, P)))}"/>`);
          for (const end of [0, item.points.length - 1]) {
            const point = item.points[end];
            const next = item.points[end === 0 ? 1 : item.points.length - 2];
            const dir = KIT.unit3(KIT.sub3(next, point));
            parts.push(KIT.lineSvg(KIT.sideRing(point, (item.r || 3.2) * 1.45, dir, P, 20), { tone: "mid" }));
          }
          svg = parts.join("");
          break;
        }
        default:
          svg = "";
      }
      if (!svg) return "";
      const tags = Object.entries(item.tags || {})
        .map(([key, value]) => `data-${key}="${String(value).replace(/"/g, "&quot;")}"`)
        .join(" ");
      return `<g class="it" data-kind="${item.kind}" data-id="${item.id || ""}"${tags ? ` ${tags}` : ""}>${svg}</g>`;
  }).join("");
  svg.innerHTML = body;
  placeLabels(P);
  applyFilter();
  say();
}

/**
 * The nameplates, in screen space.
 *
 * Each label is projected with the drawing and put over it as an ordinary
 * piece of HTML: horizontal, the right way up, and legible at every angle.
 */
function placeLabels(P) {
  let layer = stage.querySelector(".sk-labels");
  if (!layer) {
    layer = document.createElement("div");
    layer.className = "sk-labels";
    stage.appendChild(layer);
  }
  layer.innerHTML = "";
  const scale = stage.clientWidth / 1240;
  for (const item of SCENE.items) {
    if (item.kind !== "label" && item.kind !== "stream-label") continue;
    const [x, y] = KIT.iso(item.at, P);
    const box = document.createElement("div");
    box.className = `sk-label ${item.kind === "stream-label" ? "sk-label-stream" : ""}${item.emphasis ? " sk-label-name" : ""}`;
    box.textContent = item.text || "";
    box.style.left = `${x * scale}px`;
    box.style.top = `${y * scale}px`;
    box.style.fontSize = `${(item.size || 8) * scale * 0.72}px`;
    const tags = item.tags || {};
    box.dataset.compound = tags.compound || "";
    box.dataset.function = tags.function || "";
    box.dataset.colour = tags.colour || "";
    box.dataset.part = String(item.id || "").replace(/\.(name|target|label)$/, "");
    layer.appendChild(box);
  }
}

function applyFilter() {
  const groups = [...svg.querySelectorAll(".it")];
  const labels = [...stage.querySelectorAll(".sk-label")];
  if (!state.filter) {
    groups.forEach((group) => group.removeAttribute("data-active"));
    labels.forEach((label) => label.removeAttribute("data-active"));
    svg.removeAttribute("data-filtering");
    return;
  }
  svg.setAttribute("data-filtering", state.filter);
  const mark = (node) => {
    const value = node.getAttribute(`data-${state.filter}`) || "";
    node.setAttribute("data-active", value.split(" ").includes(state.value) ? "true" : "false");
  };
  groups.forEach(mark);
  labels.forEach(mark);
}

function say() {
  const parts = [`${Math.round((state.azimuth + 360) % 360)}°`];
  if (state.filter && state.value) {
    const label = state.filter === "function" ? FUNCTION_LABEL[state.value] || state.value : state.value;
    parts.push(`filter: ${label}`);
  } else {
    parts.push("no filter");
  }
  liveEl.textContent = parts.join(" · ");
}

function setFilter(kind, value) {
  if (state.filter === kind && state.value === value) {
    state.filter = null;
    state.value = null;
  } else {
    state.filter = kind;
    state.value = value;
  }
  buildFilters();
  applyFilter();
  say();
}

function buildFilters() {
  const kind = state.filter;
  filterBox.hidden = !kind;
  if (!kind) return;
  let options = [];
  if (kind === "function") {
    options = FUNCTIONS.map((fn) => [fn, FUNCTION_LABEL[fn] || fn]);
  } else if (kind === "compound") {
    const seen = new Map();
    for (const item of SCENE.items) {
      for (const id of String(item.tags?.compound || "").split(" ").filter(Boolean)) {
        if (!seen.has(id)) seen.set(id, id);
      }
    }
    options = [...seen.keys()].map((id) => [id, id]);
  } else if (kind === "colour") {
    const seen = new Map();
    for (const item of SCENE.items) {
      for (const colour of String(item.tags?.colour || "").split(" ").filter(Boolean)) {
        if (!seen.has(colour)) seen.set(colour, colour);
      }
    }
    options = [...seen.keys()].map((colour) => [colour, colour]);
  }
  filterBox.innerHTML = options
    .map(([value, label]) => `<button type="button" class="sk-chip" data-filter-value="${value}" aria-pressed="${state.value === value}"><i style="background:${value.startsWith("#") ? value : "var(--sk-flow-line)"}"></i>${label}</button>`)
    .join("");
  for (const button of filterBox.querySelectorAll("[data-filter-value]")) {
    button.addEventListener("click", () => setFilter(kind, button.getAttribute("data-filter-value")));
  }
}

for (const button of document.querySelectorAll("[data-turn]")) {
  button.addEventListener("click", () => {
    state.azimuth += Number(button.getAttribute("data-turn"));
    draw();
  });
}

for (const button of document.querySelectorAll("[data-filter-btn]")) {
  button.addEventListener("click", () => {
    const kind = button.getAttribute("data-filter-btn");
    if (state.filter === kind) {
      state.filter = null;
      state.value = null;
    } else {
      state.filter = kind;
      state.value = null;
    }
    for (const other of document.querySelectorAll("[data-filter-btn]")) {
      other.setAttribute("aria-pressed", other.getAttribute("data-filter-btn") === state.filter ? "true" : "false");
    }
    buildFilters();
    applyFilter();
    say();
  });
}

const sopToggle = document.querySelector("[data-sop-toggle]");
if (sopToggle) {
  sopToggle.addEventListener("click", () => {
    sopBox.hidden = !sopBox.hidden;
    sopToggle.setAttribute("aria-pressed", sopBox.hidden ? "false" : "true");
  });
}

const reviewBox = document.querySelector("[data-review]");
const reviewToggle = document.querySelector("[data-review-toggle]");

// The rubric judge: the deterministic checks are the floor, this is the
// judgement on top of them. It needs a key -- the one in the chat's settings
// is the one to use.
const judgeButton = document.querySelector("[data-judge]");
if (judgeButton) {
  judgeButton.addEventListener("click", async () => {
    const box = document.querySelector("[data-review-rubric]");
    let key = "";
    try {
      key = JSON.parse(localStorage.getItem("sr2.chat.settings") || "{}").key || "";
    } catch {
      key = "";
    }
    box.hidden = false;
    box.innerHTML = key ? "asking…" : "the judge needs a key: put one in the chat settings, then ask again";
    if (!key) return;
    try {
      const res = await fetch(`/api/design?judge=1&key=${encodeURIComponent(key)}`);
      const body = await res.json();
      if (body.error) {
        box.innerHTML = escapeHtml(body.error);
        return;
      }
      const verdict = body.rubric || {};
      const rows = (verdict.details || [])
        .map((d) => `<li><b>${escapeHtml(d.name)}</b> <span>${d.score}/5</span><i>${escapeHtml(d.why || "")}</i></li>`)
        .join("");
      box.innerHTML = `<p class="sk-review-score">${verdict.passed ? "passed" : "not passed"} · ${Math.round((verdict.score || 0) * 100)}% against a pass mark of ${Math.round((verdict.passMark || 0.75) * 100)}%</p><ul>${rows}</ul>`;
    } catch (err) {
      box.innerHTML = escapeHtml(String(err.message || err));
    }
  });
}

if (reviewToggle) {
  reviewToggle.addEventListener("click", () => {
    reviewBox.hidden = !reviewBox.hidden;
    reviewToggle.setAttribute("aria-pressed", reviewBox.hidden ? "false" : "true");
    if (!reviewBox.hidden && !reviewBox.dataset.filled) {
      reviewBox.dataset.filled = "true";
      document.querySelector("[data-review-verdict]").textContent = `${GRADE.verdict} · ${GRADE.passedCount || 0}/${GRADE.total || 0} checks passed`;
      document.querySelector("[data-review-checks]").innerHTML = (GRADE.checks || [])
        .map((c) => `<li class="${c.ok ? "ok" : "fail"}"><b>${escapeHtml(c.name)}</b><span>${escapeHtml(c.detail || "")}</span></li>`)
        .join("");
      document.querySelector("[data-review-parts]").innerHTML = (GRADE.parts || [])
        .map((p) => `<tr class="state-${p.state}"><td>${escapeHtml(p.name)}<i>${escapeHtml(p.id)}</i></td><td>${escapeHtml(p.state)}</td><td>${p.papers}</td><td>${p.patents}</td></tr>`)
        .join("");
    }
  });
}

// ------------------------------------------------------------- legitimacy ---
//
// What each component is built to, what applies to it, and what is still
// open. The open questions are the point: a register that only lists what is
// settled is a brochure.

const legitimacyBox = document.querySelector("[data-legitimacy]");
const legitimacyToggle = document.querySelector("[data-legitimacy-toggle]");
if (legitimacyToggle) {
  legitimacyToggle.addEventListener("click", async () => {
    legitimacyBox.hidden = !legitimacyBox.hidden;
    legitimacyToggle.setAttribute("aria-pressed", legitimacyBox.hidden ? "false" : "true");
    if (legitimacyBox.hidden || legitimacyBox.dataset.filled) return;
    const res = await fetch("/api/legitimacy?spec=blend");
    const register = await res.json();
    legitimacyBox.dataset.filled = "true";
    const s = register.summary || {};
    document.querySelector("[data-legitimacy-verdict]").textContent = `${s.parts} parts · ${s.specified} specified · ${s.partly} partly · ${s.open} open · ${s.openQuestions} questions to close`;
    document.querySelector("[data-legitimacy-rules]").innerHTML = (register.regulations || [])
      .map((r) => `<li><b>${escapeHtml(r.rule)}</b><span>${escapeHtml(r.note)}</span><i>${escapeHtml(r.question)}</i></li>`)
      .join("");
    const open = (register.parts || []).filter((p) => p.openQuestions > 0);
    document.querySelector("[data-legitimacy-open]").innerHTML = open
      .map((p) => `<li><b>${escapeHtml(p.name)}</b><span>${escapeHtml(p.verdict)}</span><i>${escapeHtml(p.entries.filter((e) => e.kind === "question" || e.strength === "open").map((e) => e.question).join(" "))}</i></li>`)
      .join("");
  });
}

// ------------------------------------------------------------------ safety ---
//
// The safety section is a question list, not a set of conclusions. Each entry
// names the rule it comes from and the person who closes it, because a
// question with an owner is a task and a task can be closed.

const safetyBox = document.querySelector("[data-safety]");
const safetyToggle = document.querySelector("[data-safety-toggle]");
if (safetyToggle) {
  safetyToggle.addEventListener("click", async () => {
    safetyBox.hidden = !safetyBox.hidden;
    safetyToggle.setAttribute("aria-pressed", safetyBox.hidden ? "false" : "true");
    if (safetyBox.hidden || safetyBox.dataset.filled) return;
    const res = await fetch("/api/safety?spec=blend");
    const safety = await res.json();
    safetyBox.dataset.filled = "true";
    document.querySelector("[data-safety-verdict]").textContent =
      safety.note || `${safety.open} open of ${safety.questions.length}`;
    document.querySelector("[data-safety-list]").innerHTML = (safety.questions || [])
      .map(
        (q) =>
          `<li${q.closed ? ' class="closed"' : ""}><b>${escapeHtml(q.id)} ${escapeHtml(q.topic)}</b>` +
          `<span>${escapeHtml(q.rule)}</span>` +
          `<i>${escapeHtml(q.question)}</i>` +
          `<em>${escapeHtml(q.owner)}</em></li>`,
      )
      .join("");
  });
}

// ---------------------------------------------------------------- diagrams ---
//
// The process, as Mermaid: one diagram for the chain and one per operation.

const diagramsBox = document.querySelector("[data-diagrams]");
const diagramToggle = document.querySelector("[data-diagram-toggle]");
if (diagramToggle) {
  diagramToggle.addEventListener("click", async () => {
    diagramsBox.hidden = !diagramsBox.hidden;
    diagramToggle.setAttribute("aria-pressed", diagramsBox.hidden ? "false" : "true");
    if (diagramsBox.hidden || diagramsBox.dataset.filled) return;
    const res = await fetch("/api/mermaid?spec=blend");
    const set = await res.json();
    diagramsBox.dataset.filled = "true";
    const one = (label, code) => `<div class="sk-diagram"><h4>${escapeHtml(label)}</h4><pre>${escapeHtml(code)}</pre><button type="button" data-copy>copy</button></div>`;
    const steps = Object.entries(set.steps || {}).map(([id, code]) => one(id, code));
    diagramsBox.querySelector("[data-diagram-list]").innerHTML = one("the whole process", set.process) + steps.join("");
    for (const button of diagramsBox.querySelectorAll("[data-copy]")) {
      button.addEventListener("click", async () => {
        const code = button.parentElement.querySelector("pre").textContent;
        try {
          await navigator.clipboard.writeText(code);
          button.textContent = "copied";
          setTimeout(() => (button.textContent = "copy"), 1500);
        } catch {
          button.textContent = "the clipboard is not available";
        }
      });
    }
  });
}

// ------------------------------------------------------------- the inspector ---
//
// Click a part and the page tells the reader what it is, what it does, the
// details that make it this part, and what it is doing in this process --
// with the papers and the patents that support it.

const inspector = document.querySelector("[data-inspector]");
const inspTitle = document.querySelector("[data-insp-title]");
const inspKind = document.querySelector("[data-insp-kind]");
const inspBody = document.querySelector("[data-insp-body]");

const escapeHtml = (value) =>
  String(value === undefined || value === null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

const link = (url, label) => (url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(label)}</a>` : escapeHtml(label));

function partHtml(part) {
  const rows = (part.details || [])
    .map((d) => `<div class="sk-insp-row"><span>${escapeHtml(d.label)}</span><b>${escapeHtml(d.value)}</b><i title="the field it came from">${escapeHtml(d.from || "")}</i></div>`)
    .join("");

  const here = [];
  if (part.here.steps && part.here.steps.length) here.push(["Steps", part.here.steps.join(" · ")]);
  if (part.here.streams && part.here.streams.length) here.push(["Carries", part.here.streams.join(" · ")]);
  if (part.here.targets && part.here.targets.length) here.push(["Targets", part.here.targets.join(" · ")]);
  if (part.here.acceptance) here.push(["Acceptance", part.here.acceptance]);
  const hereRows = here.map(([label, value]) => `<div class="sk-insp-row"><span>${escapeHtml(label)}</span><b>${escapeHtml(value)}</b></div>`).join("");

  const notes = (part.here.notes || []).map((n) => `<li>${escapeHtml(n)}</li>`).join("");

  const evidence = (part.evidence || [])
    .map((topic) => {
      const papers = (topic.papers || []).slice(0, 4).map((p) => `<li>${link(p.url, p.title || p.doi)}${p.year ? ` <span class="sk-insp-year">${p.year}</span>` : ""}</li>`).join("");
      const patents = (topic.patents || []).slice(0, 3).map((p) => `<li>${link(p.url, p.number || p.title)}${p.year ? ` <span class="sk-insp-year">${p.year}</span>` : ""}</li>`).join("");
      return `<div class="sk-insp-evidence">
        <h4>${escapeHtml(topic.question || topic.topic)}</h4>
        <p class="sk-insp-query">${escapeHtml(topic.query)}</p>
        ${papers ? `<h5>Papers</h5><ul>${papers}</ul>` : ""}
        ${patents ? `<h5>Patents</h5><ul>${patents}</ul>` : ""}
        ${!papers && !patents ? `<p class="sk-insp-none">nothing retrieved for this one yet</p>` : ""}
      </div>`;
    })
    .join("");

  return `
    <section>
      <h4>What it is</h4>
      <p>${escapeHtml(part.what.text)}</p>
      ${rows ? `<div class="sk-insp-rows">${rows}</div>` : ""}
    </section>
    <section>
      <h4>What it does</h4>
      <p>${escapeHtml(part.does.text)}</p>
      ${part.does.isolation ? `<p class="sk-insp-note">${escapeHtml(part.does.isolation)}</p>` : ""}
    </section>
    <section>
      <h4>In this process</h4>
      ${hereRows ? `<div class="sk-insp-rows">${hereRows}</div>` : `<p class="sk-insp-none">the spec does not say</p>`}
      ${notes ? `<ul class="sk-insp-notes">${notes}</ul>` : ""}
    </section>
    ${evidence ? `<section><h4>The evidence</h4>${evidence}</section>` : ""}`;
}

let currentPart = null;

function showPart(id) {
  const part = (CATALOGUE || []).find((p) => p.id === id);
  if (!part || !inspector) return;
  currentPart = part;
  inspTitle.textContent = part.name;
  inspKind.textContent = `${part.id} · ${part.type || part.kind} · ${part.function}`;
  inspBody.innerHTML = partHtml(part);
  inspector.hidden = false;
  inspector.scrollIntoView({ block: "nearest" });
  say();
}

if (inspector) {
  document.querySelector("[data-insp-close]").addEventListener("click", () => {
    inspector.hidden = true;
  });

  // A photograph of the actual vessel, read in the browser and never
  // uploaded. A client's picture of their own plant stays with them.
  const upload = document.querySelector("[data-insp-upload]");
  if (upload) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.hidden = true;
    document.body.appendChild(input);
    upload.addEventListener("click", () => input.click());
    input.addEventListener("change", () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const box = document.querySelector("[data-insp-image]");
        if (!box) return;
        box.hidden = false;
        box.innerHTML = `<img src="${reader.result}" alt="a photograph of ${escapeHtml((currentPart && currentPart.name) || "the part")}" />`;
      };
      reader.readAsDataURL(file);
    });
  }
}

// Clicking a part opens it. The parts are the drawing's groups, and so are
// the nameplates, so the label opens the same record as the vessel.
svg.addEventListener("click", (event) => {
  const group = event.target.closest(".it");
  if (!group) return;
  const id = group.getAttribute("data-id");
  if (!id) return;
  showPart(id);
});

stage.addEventListener("click", (event) => {
  const label = event.target.closest(".sk-label");
  if (!label || !label.dataset.part) return;
  showPart(label.dataset.part);
});

stage.addEventListener("keydown", (event) => {
  if (event.key === "ArrowLeft") {
    state.azimuth -= 15;
    draw();
    event.preventDefault();
  }
  if (event.key === "ArrowRight") {
    state.azimuth += 15;
    draw();
    event.preventDefault();
  }
});

buildFilters();
draw();
