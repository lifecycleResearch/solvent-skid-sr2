name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The figure is built from the anatomy kit vendored in this repo: no npm,
      # no install step.
      - name: Build the figure
        run: |
          mkdir -p deploy/public
          node figures/skid/build.mjs
          node figures/skid/build.mjs --light
          node figures/skid/build-index.mjs
          cp figures/skid/skid.html deploy/public/skid.html
          cp figures/skid/skid-light.html deploy/public/skid-light.html

      - name: Check that every line in the drawing ends on something
        continue-on-error: true
        run: node scripts/lines.mjs deploy/public/skid-light.html

      # Needs a Cloudflare API token in the repo secret CLOUDFLARE_API_TOKEN
      # (dash.cloudflare.com -> Profile -> API Tokens -> "Edit Cloudflare
      # Workers"), added with:
      #   gh secret set CLOUDFLARE_API_TOKEN --repo lifecycleResearch/solvent-skid-sr2
      # Until that secret exists the step fails harmlessly and the figure stays
      # as it was deployed from a laptop.
      - name: Deploy to Cloudflare
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: deploy
          command: deploy
